name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

  integration-test:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Containers
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for App Readiness
        run: |
          timeout 60s bash -c 'until curl -s -f http://localhost:8080/status; do echo "Waiting for API..."; sleep 5; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Integration Tests
        run: |
          INTEGRATION_TEST=1 python -m unittest tests/test_integration_docker.py -v

      - name: Collect Logs on Failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Stop Containers
        if: always()
        run: docker compose -f docker-compose.dev.yml down
