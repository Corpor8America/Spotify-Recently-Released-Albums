services:
  spotify-recent-albums:
    image: spotify-recent-albums:latest
    build:
      context: .
    container_name: recent-albums-local
    ports:
      - "8080:8080"
    volumes:
      - spotify_local_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  spotify_local_data:
